# 카드 템플릿. 복사해서 파일 이름을 <id>.yaml 로 바꾸고 채우세요. (예: term.double_play.yaml)
# ★ = 꼭 채울 칸. 나머지는 해당될 때만.
# 이 파일은 밑줄(_)로 시작해서 검사 스크립트가 건너뜀.

id: term.example            # ★ term.영어이름 또는 rule.영어이름 (소문자, 밑줄). 파일 이름과 같아야 함
kind: term                  # ★ term(용어) 또는 rule(규칙)
title: 예시 용어            # ★ 화면에 보이는 이름
category: 타격              # ★ 아래 목록 중 하나
  # 용어(term): 투구·구종 / 타격 / 주루 / 수비 / 기록·통계 / 경기 운영
  # 규칙(rule): 기본 규칙 / 타격 규칙 / 주루 규칙 / 수비 규칙 / 특수 상황
one_liner: 한 줄 설명이에요.  # ★ 60자 이내. 용어 팝업에 그대로 뜸. '~예요/~이에요' 말투
easy: >                     # ★ 2~4문장 쉬운 설명. 사전 상세 페이지 + AI 해설의 근거
  첫 문장은 무엇인지.
  둘째 문장은 언제 생기는지.
  셋째 문장은 왜 중요한지(있으면).
example: >                  # 가상 예시 상황 1개. 실제 선수 이름 쓰지 않기
  1사 1루에서 타자가 ...
when:                       # (규칙 카드 권장) 이 규칙이 적용되는 조건. AI 검증에 씀
  outs: 무사 또는 1사
  runners: 1·2루 또는 만루
more:                       # 더 알고 싶은 사람용 한두 줄 (선택)
  - 추가 설명
source:                     # ★ 규칙 카드는 규칙 번호 1개 이상 필수. 용어 카드도 참고한 곳 1개 이상
  - ref: "용어의 정의 40"   # 규칙집 조항 번호 (책에서 직접 확인한 것만)
    note: 짧은 메모
  - name: "KBO 리그 규정 2026"
    url: "https://..."
quote: 짧은 인용            # 규칙집 원문 인용은 40자 이내로만 (저작권)
related: [term.out]         # 관련 카드 id. 아직 없는 카드여도 됨(경고만 뜸)
event_types: []             # 이 카드가 설명하는 경기 이벤트. tools/event_types.txt 목록에서 고르기
aliases: [예시]             # ★ 해설 문장에서 밑줄 칠 단어들. title과 다른 표기·줄임말
review_status: draft        # ★ draft(초안) → reviewed(규칙집과 대조 끝)
reviewer: ""                # 검수한 사람
