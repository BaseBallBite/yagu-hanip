title: 땅볼/뜬공 비율
category: 기록·통계
one_liner: 땅볼 아웃과 뜬공 아웃의 비율이에요.
easy: GO/AO는 땅볼 수를 뜬공 수로 나눈 값이에요. 1보다 크면 땅볼이 더 많아요. 땅볼 유도형 투수나 땅볼 타구가 많은 타자를 설명할 때 써요.
example: 땅볼 120개, 뜬공 80개면 GO/AO는 1.50이에요.
