id: term.cutter
kind: term
title: 커터
category: 투구·구종
one_liner: 직구처럼 빠르지만 끝에서 살짝 휘는 공이에요.
easy: 커터는 직구보다 조금 느린 속도로 오다가 타자 앞에서 글러브 쪽으로 살짝 휘어요. 우완 투수의 커터는 우타자에게서 멀어지고 좌타자 몸쪽으로 들어가요. 슬라이더보다 덜 휘고 더 빨라서 배트 한가운데에 맞히기 어렵게 해요.
example: '몸쪽으로 살짝 휘는 커터에 타자 배트가 부러지며 땅볼이 됐어요.

  '
