id: term.game_winning_rbi
kind: term
title: 결승타
category: 기록·통계
one_liner: 이긴 팀이 마지막으로 앞서 나가게 만든 타점이에요.
easy: 이긴 팀이 마지막으로 앞서 나간 점수를 만든 타자에게 주는 기록이에요. 그 뒤로 상대가 따라오지 못하고 그대로 이겨야 해요. 처음부터 계속 이기던 경기라면 첫 점수를 낸 타자가 받아요. 실책이나 폭투로 난 점수처럼 타점이 아니면 그 경기는 결승타 없음이에요.
example: 2대2 동점이던 8회에 적시타로 3대2가 됐고, 상대가 끝내 점수를 못 내 그대로 끝났다면 그 적시타를 친 타자가 결승타예요.
more:
- 안타만 해당하는 게 아니에요. 희생플라이나 밀어내기 볼넷도 타점이면 결승타가 될 수 있어요.
- 공식야구규칙에는 없고 KBO 기록실 항목으로만 집계돼요. MLB에서는 1980년부터 집계했다가 의미가 없다는 평가로 1988년에 폐지했고, 일본 NPB에서도 1981~1988년 공식 기록이었어요.
- 세부 인정 기준을 적은 KBO 규정 원문은 확보하지 못했어요. 위 설명은 KBO 공식 경기 기록에 결승타가 쓰이는 사례와 사용자 편집형 위키 설명을 바탕으로 해서 검증이 더 필요해요.
