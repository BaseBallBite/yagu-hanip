easy: 이기고 있는 팀의 구원 투수가 세이브 조건(9.19)에 맞는 상황에 올라오면 세이브 기회 1번이에요. 그중 성공하면 세이브, 실패하면 블론세이브예요.
example: 세이브 기회 30번 중 27번 성공하면 세이브 27개, 블론세이브 3개예요.
