id: term.hold
kind: term
title: 홀드
category: 기록·통계
one_liner: 리드를 지키고 다음 투수에게 넘긴 중간 계투에게 주는 기록이에요.
easy: 홀드는 세이브 규정에 준하는 조건을 갖추고 던지다가 리드를 지킨 채 물러난 중간 계투 투수에게 주는 기록이에요. 마무리 투수 앞에서 던지는 투수들의 활약을 보여줘요. 한 경기에 여러 명이 받을 수 있어요. 승리투수나 패전투수에게는 주지 않아요.
example: '1점 앞선 8회에 나와 무실점으로 막고 마무리에게 넘긴 투수가 홀드를 받았어요.

  '
source:
- name: KBO 리그 규정 2026
  ref: 제12조 홀드규정
  note: 공식야구규칙 9장에는 정의가 없음
