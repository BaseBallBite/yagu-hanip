more:
- 물러난 뒤 이어 던진 투수가 점수를 줘서 동점이나 역전이 되어도 홀드는 그대로예요. 다만 이닝 도중 주자를 남기고 내려갔는데 그 주자 때문에 동점이나 역전이 되면 홀드가 없어요.
