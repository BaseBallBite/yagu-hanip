title: 수비 포지션
category: 기록·통계
one_liner: 야수가 서는 수비 위치예요.
easy: 스코어 기록에서는 투수 1, 포수 2, 1루수 3, 2루수 4, 3루수 5, 유격수 6, 좌익수 7, 중견수 8, 우익수 9 번호를 써요. 6-4-3 병살은 유격수→2루수→1루수 순서로 던졌다는 뜻이에요.
example: 6-4-3은 유격수가 잡아 2루수에게, 다시 1루수에게 던진 병살이에요.
