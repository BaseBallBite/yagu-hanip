title: 승률
category: 기록·통계
one_liner: 승수를 승수와 패수의 합으로 나눈 값이에요.
easy: 승률은 이긴 경기 수를 이긴 수와 진 수의 합으로 나눈 값이에요. 무승부는 계산에 넣지 않아요. 정규시즌 순위는 이 승률로 정해요.
example: 70승 5무 69패인 팀의 승률은 70÷139 = 약 0.504예요.
