id: term.fastball
kind: term
title: 직구
category: 투구·구종
one_liner: 가장 빠르고 곧게 날아가는 기본 구종이에요.
easy: 직구(포심 패스트볼)는 투수가 가장 빠르게, 가장 자주 던지는 공이에요. 실밥이 가로로 지나가게 쥐어서 역회전이 걸리고, 움직임이 거의 없이 곧게 날아가요. MLB 평균 구속은 시속 약 151km(94마일)이고 빠른 투수는 160km를 넘기도 해요. 다른 변화구와 섞어 던져 타자의 타이밍을 흔들어요.
example: '투수가 시속 150km 직구로 타자의 헛스윙을 끌어냈어요.

  '
