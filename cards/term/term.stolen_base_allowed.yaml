id: term.stolen_base_allowed
kind: term
title: 도루 허용·도루 저지
category: 기록·통계
one_liner: 수비 쪽에서 본 도루 기록이에요.
easy: 수비(주로 포수) 입장에서 상대 도루를 막지 못한 게 도루 허용(SB)이고, 도루를 시도한 주자를 잡은 게 도루 저지(CS)예요. 저지 비율이 도루저지율이에요.
example: 도루 시도 10번 중 4번 잡으면 도루 저지 4, 도루 허용 6이에요.
source:
