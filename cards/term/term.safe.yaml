id: term.safe
kind: term
title: 세이프
category: 주루
one_liner: 주자가 베이스를 차지할 권리를 심판이 인정한 거예요.
easy: 심판이 주자가 베이스를 점유할 수 있다고 선언하면 세이프예요. 아웃되지 않았다는 뜻이에요. 비디오 판독으로 바뀔 수도 있어요.
example: 도루하던 주자가 2루에 먼저 닿아 심판이 세이프를 선언했어요.
