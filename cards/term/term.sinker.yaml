id: term.sinker
kind: term
title: 싱커(투심 패스트볼)
category: 투구·구종
one_liner: 직구처럼 빠르지만 던지는 팔 쪽으로 움직이며 가라앉는 공이에요.
easy: 싱커는 직구와 비슷한 속도로 오면서 던지는 팔 쪽으로 움직이거나 아래로 가라앉는 공이에요. 투심 패스트볼이라고도 불러요. 우완 투수의 싱커는 우타자 몸쪽으로 파고들어요. 타자가 공 위쪽을 맞히게 만들어서 땅볼이 많이 나와요.
example: 몸쪽으로 파고드는 싱커에 타자가 빗맞은 땅볼을 쳐서 유격수 앞으로 굴러갔어요.
