title: 베이스
category: 경기 운영
one_liner: 주자가 득점하려면 닿아야 하는 네 곳이에요.
easy: 베이스는 1루, 2루, 3루와 홈플레이트(본루) 네 곳이에요. 주자는 이 순서대로 모두 닿아야 득점해요. 베이스 사이 거리는 90피트(약 27.4m)이고, KBO는 18인치 크기의 베이스를 써요.
example: 주자가 2루 베이스를 밟고 3루로 달렸어요.
