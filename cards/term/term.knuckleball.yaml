id: term.knuckleball
kind: term
title: 너클볼
category: 투구·구종
one_liner: 회전을 거의 주지 않아 불규칙하게 흔들리며 오는 느린 공이에요.
easy: 너클볼은 손가락 끝으로 공을 밀어 던져 회전이 거의 없어요. 회전이 없어서 공이 불규칙하게 흔들리고, 타자도 포수도 어디로 갈지 예측하기 어려워요. 던지는 투수가 매우 드물어요.
example: 너클볼이 타자 앞에서 흔들리며 떨어져 헛스윙이 나왔어요.
source:
- name: 팀 작성(일반 야구 용어)
