easy: 타자의 출루율, 장타율, OPS를 투수 입장에서 계산한 거예요. 피출루율은 상대가 얼마나 나갔는지, 피장타율은 얼마나 멀리 쳤는지 보여줘요. 낮을수록 좋아요.
example: 피OPS가 0.650이면 상대 타자들이 이 투수에게 평균 이하로 쳤다는 뜻이에요.
