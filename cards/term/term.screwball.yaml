id: term.screwball
kind: term
title: 스크루볼
category: 투구·구종
one_liner: 일반 변화구와 반대 방향으로 휘는 공이에요.
easy: 스크루볼은 다른 변화구와 반대 방향, 즉 던지는 팔 쪽으로 휘는 공이에요. 오른손 투수가 던지면 오른손 타자 몸쪽으로 휘며 떨어져요. 특이한 투구 동작이 필요하고 팔에 부담이 커서 요즘은 거의 던지는 선수가 없어요.
example: 오래된 경기 영상에서 스크루볼이 타자 몸쪽으로 휘어 들어왔어요.
