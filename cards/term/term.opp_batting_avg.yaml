id: term.opp_batting_avg
kind: term
title: 피안타율
category: 기록·통계
one_liner: 투수가 상대 타자에게 안타를 맞은 비율이에요.
easy: 피안타 수를 상대 타자의 타수로 나눈 값이에요. 타자의 타율과 같은 방식으로, 투수 입장에서 계산해요. 낮을수록 잘 던진 거예요.
example: 타수 100 중 안타를 20개 맞았다면 피안타율은 0.200이에요.
source:
- name: 공식야구규칙 2026
  ref: 9.21(a)
  note: 타율 계산 방식을 투수에게 적용
