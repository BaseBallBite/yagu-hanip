id: term.lure_pitch
kind: term
title: 유인구
category: 투구·구종
one_liner: 존 밖으로 던져 타자가 방망이를 내게 만드는 공이에요.
easy: 유인구는 스트라이크 존 근처나 바로 밖으로 던져서 타자가 스트라이크로 착각해 방망이를 내게 만드는 공이에요. 타자가 참으면 볼이 되고, 속으면 헛스윙이나 약한 땅볼이 돼요. 주로 낮게 떨어지는 변화구를 많이 써요.
example: 2스트라이크에서 투수가 존 아래로 떨어지는 포크볼을 던졌고, 타자가 속아서 헛스윙 삼진을 당했어요.
