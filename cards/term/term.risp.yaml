one_liner: 2루나 3루에 주자가 있을 때의 타율이에요.
easy: 득점권은 안타 하나로 점수가 날 수 있는 2루·3루에 주자가 있는 상황이에요. 이때의 타율이 득점권 타율이고, 찬스에 강한 타자인지 볼 때 써요. KBO 기록실 타자 세부 항목이에요.
example: 득점권에서 40타수 14안타면 득점권 타율은 0.350이에요.
