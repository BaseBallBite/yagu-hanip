one_liner: 배트를 휘두르지 않고 공에 살짝 대서 굴리는 타격이에요.
easy: '번트는 배트를 앞에 대고 공을 맞혀 내야에 천천히 굴리는 타격이에요. 주자를 다음 베이스로 보내거나, 발 빠른 타자가 1루에서 살려고 할 때 써요. 2스트라이크에서 번트가 파울이 되면 삼진이에요.

  '
example: '무사 1루에서 타자가 3루 쪽으로 번트를 대 공을 굴렸어요.

  '
