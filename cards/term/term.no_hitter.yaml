id: term.no_hitter
kind: term
title: 노히트노런
category: 기록·통계
one_liner: 투수가 경기 끝까지 안타와 점수를 하나도 내주지 않은 거예요.
easy: 노히트노런은 한 투수가 경기 전체를 던지면서 안타를 하나도 맞지 않고 점수도 주지 않은 경기예요. 볼넷이나 실책으로 주자가 나가도 안타만 없으면 돼요. 주자를 한 명도 내보내지 않으면 퍼펙트게임이라고 해요. 공식야구규칙에는 이 정의가 없어요.
example: '볼넷은 2개 내줬지만 안타 없이 9이닝을 막아 노히트노런을 기록했어요.

  '
source:
