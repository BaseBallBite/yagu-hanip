one_liner: 지금 타자가 받은 볼과 스트라이크 개수예요.
easy: '볼카운트는 ''2볼 1스트라이크''처럼 볼 개수와 스트라이크 개수를 함께 말해요. 3볼 2스트라이크는 풀카운트라고 하고, 다음 공에 볼넷이나 삼진이 나올 수 있어요.

  '
