title: 루타(루타수)
category: 기록·통계
one_liner: 안타로 나간 베이스 수를 점수처럼 합친 숫자예요.
easy: 단타는 1, 2루타는 2, 3루타는 3, 홈런은 4로 세어 더한 값이에요. 장타율은 이 루타수를 타수로 나눈 값이에요.
example: 단타 2개와 홈런 1개면 루타수는 2×1 + 4 = 6이에요.
