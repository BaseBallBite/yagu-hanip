easy: 텍사스 안타는 잘 맞지 않은 공이 내야 뒤, 외야 앞 빈 곳에 뚝 떨어져 안타가 된 거예요. 정타가 아니어도 수비 사이 빈 곳에 떨어지면 안타로 기록돼요.
example: 빗맞은 공이 유격수와 중견수 사이에 떨어져 텍사스 안타가 됐어요.
