id: term.forkball
kind: term
title: 포크볼
category: 투구·구종
one_liner: 손목을 꺾어 던지는, 타자 앞에서 뚝 떨어지는 드문 공이에요.
easy: 포크볼은 검지와 중지 사이에 공을 깊게 끼우고 손목을 아래로 꺾으며 던지는 공이에요. 회전이 적고 타자 앞에서 아래로 뚝 떨어져요. 던지기 힘들어서 던지는 투수가 드물어요. 스플리터와 비슷하지만 손목 동작이 달라서 따로 구분해요.
example: '낮게 떨어지는 포크볼에 타자가 헛스윙해 삼진이 됐어요.

  '
