id: term.batter_hand
kind: term
title: 좌타자·우타자
category: 타격
one_liner: 왼손으로 치면 좌타자(1루 쪽 타석), 오른손으로 치면 우타자(3루 쪽 타석)예요.
easy: 좌타자는 왼손으로 치고 1루 쪽 타석(포수가 보기엔 오른쪽)에 서요. 우타자는 오른손으로 치고 3루 쪽 타석(포수가 보기엔 왼쪽)에 서요. 좌타자는 1루에 조금 더 가까워요. 일반적으로 타자는 같은 손 투수에게 약하고 반대 손 투수에게 강한 편이라, 대타나 투수 교체에 자주 쓰여요. 양쪽 다 칠 수 있는 타자는 스위치히터라고 해요.
example: 좌투수에게 약한 좌타자 대신 우타자 대타를 냈어요.
source:
