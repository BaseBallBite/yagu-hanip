id: term.tough_save
kind: term
title: 터프세이브
category: 기록·통계
one_liner: 동점 주자가 나가 있을 때 올라와 리드를 지킨 세이브예요.
easy: 구원 투수가 올라올 때 이미 동점 주자가 루에 나가 있는데, 그 리드를 지키고 세이브를 올리면 터프세이브예요. 일반 세이브보다 어려운 상황을 따로 보려고 통계에서 쓰는 말이에요. KBO의 공식 세이브 기준과는 별개예요.
example: 4대3으로 앞선 9회 1사 2루에서 올라온 투수가 남은 타자를 잡고 이겼다면 터프세이브예요.
more:
- 같은 기준이 미국에서도 쓰였어요. 구원상 Rolaids가 2000년부터 동점 주자가 루상에 있을 때 등판한 세이브를 터프세이브로 집계했다고 SABR 글에 나와요. 다만 KBO 공식 규정에서 터프세이브 정의는 확인하지 못했어요. 누가 처음 정의했는지도 확인하지 못해서 적지 않았어요.
