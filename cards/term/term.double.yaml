title: 2루타
category: 타격
one_liner: 타자가 안타를 치고 2루까지 간 거예요.
easy: '타자가 친 공으로 수비 실수 없이 2루까지 가면 2루타예요. 외야 깊숙이 날아가거나 외야수 사이를 가르는 타구에서 많이 나와요.

  '
example: '타구가 좌중간을 가르자 타자가 2루까지 들어가 2루타가 됐어요.

  '
