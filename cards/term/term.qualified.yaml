id: term.qualified
kind: term
title: 규정타석·규정이닝
category: 기록·통계
one_liner: 타율왕·평균자책점왕 같은 개인 타이틀을 받으려면 채워야 하는 최소 기준이에요.
easy: 타자는 소속 팀이 한 시즌에 치른 경기 수의 3.1배 이상 타석에 서야 타율·장타율·출루율 타이틀 자격이 생겨요. 투수는 팀 경기 수와 같은 수 이상의 이닝을 던져야 평균자책점 타이틀 자격이 생겨요. 타석이 조금 모자라도 모자란 만큼 타수에 더해 계산해도 1위면 타율왕이 될 수 있어요.
example: 팀이 144경기를 치르면 규정타석은 144×3.1 = 446타석(소수점 이하 버림)이에요.
