id: term.pitch_location
kind: term
title: 투구 코스(몸쪽·바깥쪽)
category: 투구·구종
one_liner: 공이 홈플레이트 위를 지나는 위치를 부르는 말이에요.
easy: 몸쪽은 타자에 가까운 쪽, 바깥쪽은 타자에서 먼 쪽이에요. 높은 공은 하이, 낮은 공은 로우라고 불러요. 존 구석을 노리는 공은 코너워크라고 하고, 가운데로 들어가면 한가운데 공이라고 해요.
example: 투수가 몸쪽 높은 직구로 타자의 타이밍을 뺏은 뒤 바깥쪽 낮은 슬라이더로 삼진을 잡았어요.
