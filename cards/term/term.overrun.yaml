id: term.overrun
kind: term
title: 오버런
category: 주루
one_liner: 베이스를 밟은 뒤 멈추지 못하고 지나쳐 달리는 거예요.
easy: 주자가 베이스를 밟고도 속도를 못 줄여 그 베이스를 지나쳐 달리는 걸 오버런이라고 해요. 1루에서는 지나쳐 달려도 곧바로 돌아오면 아웃이 아니에요. 2루나 3루에서 지나쳐 베이스에서 떨어지면 수비가 몸에 태그해서 아웃시킬 수 있어요. 1루를 지나친 뒤 곧바로 돌아오지 않고 2루로 가려는 행동을 하면 태그당해 아웃이에요.
example: 내야 땅볼을 치고 1루를 밟은 뒤 몇 걸음 더 달렸지만 곧바로 1루로 돌아와서 세이프였어요.
source:
- name: 공식야구규칙 2026
  ref: 5.09(b)(11)
  note: 1루를 오버런한 뒤 곧바로 귀루하지 않았을 경우
