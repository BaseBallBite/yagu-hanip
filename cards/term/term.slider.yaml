id: term.slider
kind: term
title: 슬라이더
category: 투구·구종
one_liner: 빠르게 오다가 옆으로 휘는 변화구예요.
easy: 슬라이더는 커브보다 빠르고 움직임이 적은 변화구예요. 던지는 팔 반대쪽(글러브 쪽)으로 휘어서, 오른손 투수의 슬라이더는 우타자에게서 멀어져요. 직구와 비슷해 보여서 타자가 헛스윙하기 쉬워요.
example: '2스트라이크에서 바깥쪽으로 휘는 슬라이더에 타자가 헛스윙 삼진을 당했어요.

  '
