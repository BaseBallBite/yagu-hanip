id: term.walks_hbp
kind: term
title: 사사구
category: 기록·통계
one_liner: 볼넷, 몸에 맞는 공, 고의4구를 묶어 부르는 말이에요.
easy: 사사구는 타자가 공을 치지 않고 1루에 나간 경우를 합친 말이에요. 볼 4개로 나가면 볼넷이고, 그중 스트라이크 없이 볼 4개만 던져 내준 건 스트레이트 볼넷이에요. 몸에 맞는 공은 사구예요. 고의4구는 덕아웃에서 일부러 내보내라는 신호를 낸 거라서 투수가 흔들려서 내준 볼넷과 따로 봐요.
example: 투수가 볼넷 3개와 몸에 맞는 공 1개를 내줬다면 사사구는 4개예요.
source:
