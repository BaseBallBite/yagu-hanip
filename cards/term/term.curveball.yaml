title: 커브
category: 투구·구종
one_liner: 느리게 크게 떨어지는 변화구예요.
easy: 커브는 다른 공보다 움직임이 크고 속도가 느린 변화구예요. 위에서 아래로 곧장 떨어지는 커브도 있고, 옆으로 크게 휘는 커브도 있어요. 직구보다 훨씬 느려서 타자의 타이밍을 빼앗는 데 써요.
example: '빠른 직구 다음에 느린 커브가 들어와 타자가 그대로 지켜봤고 스트라이크가 됐어요.

  '
