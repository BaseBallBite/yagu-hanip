title: 타순
category: 경기 운영
one_liner: 타자들이 타석에 들어서는 정해진 순서예요.
easy: '경기 전에 감독이 1번부터 9번까지 타자 순서를 정해 내요. 1번은 보통 잘 나가는 타자, 3·4·5번은 장타를 칠 수 있는 중심 타자(클린업)를 둬요.

  '
example: '9번 타자가 아웃되자 다음 타석에는 다시 1번 타자가 들어섰어요.

  '
