id: term.knuckle_curve
kind: term
title: 너클커브
category: 투구·구종
one_liner: 검지 마디를 구부려 던지는, 크게 떨어지는 커브예요.
easy: 너클커브는 커브처럼 던지되 검지 마디를 구부려 공에 올리는 구종이에요. 커브처럼 위에서 아래로 크게 떨어지고, 너클볼처럼 움직임이 불규칙해지기도 해요. 스파이크 커브라고도 불러요.
example: 직구 뒤에 들어온 너클커브에 타자가 타이밍을 뺏겨 삼진을 당했어요.
