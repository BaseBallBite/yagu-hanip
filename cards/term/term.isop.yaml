title: 순수장타율
category: 기록·통계
one_liner: 장타율에서 타율을 뺀 값이에요.
easy: ISOP는 장타율 − 타율이에요. 단타를 빼고 장타(2루타 이상)로 얻은 추가 루타만 보여줘서 장타력을 따로 볼 수 있어요.
example: 장타율 0.500, 타율 0.300이면 순수장타율은 0.200이에요.
