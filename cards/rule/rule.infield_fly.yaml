id: rule.infield_fly
kind: rule
title: 인필드 플라이
category: 수비 규칙
one_liner: 수비수가 뜬공을 일부러 놓쳐 주자를 한꺼번에 잡는 걸 막는 규칙이에요.
easy: '무사나 1사에 주자가 1·2루 또는 만루일 때 내야로 높이 뜬 공이 나오면 심판이 인필드 플라이를 선언해요. 선언되면 공을 잡든 못 잡든 타자는 아웃이에요. 이 규칙이 없으면 수비가 일부러 공을 떨어뜨려 베이스에 묶인 주자들을 한꺼번에 아웃시킬 수 있기 때문이에요.

  '
example: '1사 1·2루에서 타자가 2루수 쪽으로 높은 뜬공을 쳤어요. 심판이 인필드 플라이를 선언했고, 2루수가 공을 놓쳤지만 타자는 아웃이에요.

  '
when:
  outs: 무사 또는 1사
  runners: 1·2루 또는 만루
  ball: 내야수가 평범한 수비로 잡을 수 있는 플라이 볼
  excluded:
  - 직선타구
  - 번트가 떠서 된 플라이 볼
more:
- 투수·포수, 내야에 자리 잡은 외야수도 이 규칙에서는 내야수로 봐요.
- 선언돼도 공은 살아 있어서, 주자는 위험을 감수하고 진루할 수 있어요.
source:
- name: 공식야구규칙 2026
  ref: 용어의 정의 40. INFIELD FLY
- name: 공식야구규칙 2026
  ref: 5.09(a)(5)
  note: 인필드 플라이가 선언되면 타자 아웃
quote: 무사 또는 1사에 주자 1·2루 또는 만루일 때
