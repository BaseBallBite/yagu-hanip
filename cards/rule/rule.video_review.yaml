id: rule.video_review
kind: rule
title: 비디오 판독
category: 특수 상황
one_liner: 감독이 요청하면 영상으로 심판 판정을 다시 확인하는 제도예요.
easy: 비디오 판독은 감독만 신청할 수 있고, 심판이 판정을 내린 뒤 30초 안에 말로 요청해야 해요. 홈런, 페어/파울, 포스·태그 플레이의 아웃/세이프, 몸에 맞는 공, 홈 충돌, 체크스윙 같은 정해진 플레이만 대상이에요. 중계가 있는 경기에서 판독센터가 영상을 보고 결과를 심판팀장에게 알리면, 심판팀장이 최종 판정을 내려요.
example: 2루 도루가 세이프로 선언되자 수비 팀 감독이 30초 안에 판독을 요청했고, 판독센터가 영상을 보고 아웃으로 바꿨어요.
when:
  who: 각 구단 감독(감독이 없을 땐 총재에게 대행 통보된 코치)
  timing: 심판 판정 후 30초 이내
  broadcast: 중계가 편성된 경기에서만
  targets:
  - 홈런
  - 페어/파울
  - 포스·태그 플레이 아웃/세이프
  - 야수의 포구
  - 몸에 맞는 공(맞았는지 여부만)
  - 타자의 파울/헛스윙
  - 홈 충돌
  - 병살 시도 시 슬라이딩
  - 1루 3피트 라인 위반
  - 3아웃 이전 주자의 득점
  - 누의 공과
  - 선행주자 추월
  - 태그업 시점
  - 수비 시프트 제한 위반
  - 체크스윙
source:
- name: KBO 리그 규정 2026
  ref: 제28조 비디오 판독
  note: 2026.1.20 개정 반영
