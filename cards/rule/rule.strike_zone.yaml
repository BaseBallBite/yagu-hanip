id: rule.strike_zone
kind: rule
title: 스트라이크 존
category: 기본 규칙
one_liner: 홈플레이트 위의 보이지 않는 네모예요. 공이 여기를 지나가면 스트라이크예요.
easy: '스트라이크 존은 홈플레이트 위에 있는 보이지 않는 네모 상자예요. 공이 이 상자를 지나가면 타자가 치지 않아도 스트라이크가 돼요. KBO는 사람 심판 대신 기계(ABS)가 공의 위치를 재서 판정해요.

  '
example: '타자가 가만히 서 있었는데 공이 무릎 높이로 존 안에 들어와 스트라이크가 선언됐어요.

  '
when:
  height: 지면에서 타자 키의 27.04% ~ 55.75% (2026 KBO 공식 안내 기준)
  width: 홈플레이트 43.18cm + 양옆 2cm씩 = 47.18cm
  depth: 홈플레이트 중간면과 끝면 모두 상하 기준을 충족해야 스트라이크
more:
- 규칙집의 정의(용어의 정의 73)는 사람 심판 시절 기준(어깨와 바지 윗부분 중간 ~ 무릎 아랫부분)이에요. ABS 수치는 KBO 리그 규정에 있어요.
- 해설은 기록된 판정 결과를 근거로 하고, 좌표로 판정을 다시 계산해 단정하지 않아요.
- ABS 존의 정확한 비율(키 대비 %)은 2026 연감에 없어요. 연감에는 '존 기준은 실행위원회가 정한다'고만 나와 있고, 위 수치는 KBO 홈페이지 2026 주요 규정·규칙 안내에서 확인했어요.
