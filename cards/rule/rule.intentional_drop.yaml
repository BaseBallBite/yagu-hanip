id: rule.intentional_drop
kind: rule
title: 고의낙구
category: 수비 규칙
one_liner: 내야수가 일부러 뜬공을 떨어뜨려 주자를 노리는 걸 막는 규칙이에요.
easy: 무사나 1사에 주자가 1루, 1·2루, 1·3루 또는 만루일 때 내야수가 쉽게 잡을 수 있는 페어 뜬공이나 직선타를 땅에 닿기 전 손이나 글러브에 댄 뒤 일부러 떨어뜨리면 타자는 아웃이에요. 이때는 공이 죽고 주자는 원래 베이스로 돌아가요. 인필드 플라이가 선언되면 그 규칙이 우선해요.
example: 1사 1·2루에서 3루수가 쉬운 직선타를 글러브에 맞힌 뒤 일부러 떨어뜨렸어요. 심판은 타자 아웃을 선언하고 주자들을 원래 베이스로 돌려보냈어요.
when:
  outs: 무사 또는 1사
  runners: 1루, 1·2루, 1·3루 또는 만루
  ball: 쉽게 잡을 수 있는 페어 플라이 볼 또는 직선타
source:
- name: 공식야구규칙 2026
  ref: 5.09(a)(12)
  note: 내야수의 고의낙구
related:
- rule.infield_fly
- rule.force_play
- term.fly_ball
event_types: []
aliases:
