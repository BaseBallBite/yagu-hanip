id: rule.three_foot_lane
kind: rule
title: 3피트 라인(주루 레인)
category: 타격 규칙
one_liner: 타자주자가 1루 쪽으로 뛸 때 송구를 방해하지 않도록 정해진 달리는 길이에요.
easy: 타자가 친 뒤 본루에서 1루 사이의 뒤쪽 절반을 달릴 때는 파울 라인 바깥의 3피트 선 안쪽(레인) 안에서 달려야 해요. 이 길을 벗어나 달리다가 1루로 던지는 공을 받으려는 야수를 방해했다고 심판이 보면 타자주자는 아웃이에요. 타구를 처리하는 야수를 피하려고 벗어난 건 괜찮아요.
example: 포수가 1루로 던진 공이 타자주자의 몸 쪽으로 날아갔는데, 타자주자가 레인 바깥 잔디를 달리고 있어 심판이 방해로 보고 아웃을 선언했어요.
when:
  where: 본루~1루 사이 후반부
  violation: 레인 밖을 달려 1루 송구를 처리하는 야수를 방해
source:
