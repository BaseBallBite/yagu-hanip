id: rule.suspended_game
kind: rule
title: 서스펜디드 경기
category: 특수 상황
one_liner: 경기를 끝내지 못하고 멈췄다가 나중에 이어서 하는 경기예요.
easy: 조명이 없는 구장에서 해가 져서 9회까지 갈 수 없거나, 포스트시즌에서 날씨 때문에 계속할 수 없을 때 경기를 일시 정지(서스펜디드)해요. 정지된 경기는 나중에 멈춘 상황부터 이어서 해요. 퓨처스리그에서는 서스펜디드 경기가 없고, 이닝 도중 중단되면 그 이닝을 무효로 해요.
example: 조명이 없는 구장 낮 경기가 7회에 해가 져서 계속할 수 없어 서스펜디드 경기가 선언됐어요.
when:
  daytime_no_lights: 일몰 15분 전에는 새 이닝에 들어갈 수 없고, 9회까지 못 가면 서스펜디드
  postseason: 날씨 등으로 진행 불가 시 노게임·콜드게임 없이 서스펜디드
  futures: 서스펜디드 없음, 이닝 도중 중단 시 그 이닝 무효
source:
- name: 공식야구규칙 2026
  ref: 용어의 정의 74. SUSPENDED GAME, 7.02
- name: KBO 리그 규정 2026
  ref: 제22조 (정규시즌), 제46조 4항 (포스트시즌), 제76조 (퓨처스리그)
