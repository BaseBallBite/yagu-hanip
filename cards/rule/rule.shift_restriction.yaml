id: rule.shift_restriction
kind: rule
title: 수비 시프트 제한
category: 수비 규칙
one_liner: 투구 전에 내야수를 2루 한쪽에 몰아 세우지 못하게 하는 규칙이에요.
easy: KBO에서는 투수가 공을 놓는 순간 투수·포수를 뺀 내야수 4명이 내야 흙 안쪽에 있어야 하고, 2루를 기준으로 양쪽에 최소 2명씩 서야 해요. 이닝 첫 투구 뒤에는 2루 양쪽 내야수가 자기 쪽을 바꿀 수 없어요. 어기면 타자가 처음 공을 만진 선수가 위반한 경우 타자는 1루로 나가고 주자도 한 베이스씩 가요. 그 밖의 경우에는 볼이 선언돼요.
example: 투수가 공을 던질 때 내야수 3명이 2루 오른쪽에 서 있자 심판이 위반을 선언하고 그 투구를 볼로 처리했어요.
when:
  must: 내야 흙 바깥선 안쪽에 내야수 4명, 2루 양쪽에 각각 2명
  inning: 이닝 첫 투구 뒤에는 2루 기준 좌우 위치 교대 금지
source:
- name: 공식야구규칙 2026
  ref: 5.02(c)
  note: KBO 수비 시프트 제한(2026 강화)
- name: KBO 리그 규정 2026
  ref: 제28조 3항 ⑭
  note: 시프트 제한 위반 판정은 비디오 판독 대상
