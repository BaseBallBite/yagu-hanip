id: rule.run_scoring
kind: rule
title: 득점 인정
category: 기본 규칙
one_liner: 3아웃째가 어떻게 나오느냐에 따라 마지막 순간의 득점이 인정되지 않을 수 있어요.
easy: 주자가 홈을 밟기 전에 3아웃이 되면 득점이 인정되지 않는 경우가 있어요. 타자주자가 1루에 닿기 전에 아웃되거나, 포스 아웃으로 3아웃이 되거나, 앞선 주자가 베이스를 밟지 못해 어필로 아웃되었을 때가 그래요. 그 외의 태그 아웃으로 3아웃이 되면, 그 전에 홈을 밟은 주자의 점수는 인정돼요.
example: 2사 만루에서 타자가 땅볼을 쳐 2루에서 포스 아웃이 되어 3아웃이 됐어요. 그 사이 3루 주자가 홈을 밟았지만 득점은 인정되지 않았어요.
when:
  no_score_if:
  - 타자주자가 1루 닿기 전에 3아웃
  - 포스 아웃으로 3아웃
  - 선행주자 누의 공과 어필로 3아웃
source:
