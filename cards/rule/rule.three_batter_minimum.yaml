id: rule.three_batter_minimum
kind: rule
title: 세 타자 상대 규정
category: 수비 규칙
one_liner: 구원 투수는 최소 세 명의 타자를 상대하고 내려와야 하는 퓨처스리그 규정이에요.
easy: KBO 퓨처스리그에서는 선발·구원 투수가 그때의 타자를 포함해 연속된 세 명의 타자에게 투구해야 하고, 그 전에는 교체할 수 없어요. 세 타자를 상대하기 전에 이닝이 끝나면 이닝 교대 때는 교체할 수 있어요. 부상이나 질병으로 던질 수 없다고 주심이 인정하면 예외예요.
example: 퓨처스리그에서 구원 투수가 한 타자만 상대하고 이닝이 끝나, 이닝 교대 때 교체됐어요.
when:
  applies: KBO 퓨처스리그만
  exception: 부상·질병, 우천 재개 후 부상 위험
source:
- name: 공식야구규칙 2026
  ref: 5.10(g)
  note: KBO는 퓨처스리그에만 적용
related:
