id: rule.no_game
kind: rule
title: 노게임
category: 특수 상황
one_liner: 정식경기가 되기 전에 끝나 아무 기록도 인정하지 않는 경기예요.
easy: 5회가 채워지기 전에 주심이 경기 종료를 명하면 노게임이 선언돼요. 노게임이면 그 경기는 없던 일로 하고 개인 기록도 인정하지 않아요.
example: 3회에 폭우로 경기가 중단되어 끝내 재개하지 못했고 노게임이 선언됐어요.
source:
- name: 공식야구규칙 2026
  ref: 7.01(e)
  note: 정식경기가 되기 전 종료 → 노게임
