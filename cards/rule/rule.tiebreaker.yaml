id: rule.tiebreaker
kind: rule
title: 승부치기
category: 특수 상황
one_liner: 연장에서 주자를 1·2루에 미리 놓고 시작해 빨리 승부를 내는 방식이에요.
easy: 승부치기는 연장 이닝을 주자가 1·2루에 있는 상태로 시작하는 방식이에요. KBO 1군 정규시즌에는 쓰지 않고, 올스타전은 10회부터 이닝 제한 없이 써요. 퓨처스리그는 10~12회에 쓰고 그래도 동점이면 무승부예요.
example: 퓨처스리그 10회초가 1·2루 주자가 놓인 채 시작됐고, 이 주자들은 기록상 실책으로 나간 걸로 쳐요.
when:
  all_star: 10회부터, 이닝 제한 없음
  futures: 10~12회, 이후 무승부
  runners: 1·2루 (타자는 이전 이닝 타순에서 이어서)
  double_header_7inning: 7이닝으로 하는 퓨처스 더블헤더에서는 안 함
source:
- name: KBO 리그 규정 2026
  ref: 제53조 2항 (올스타전), 제59조 (퓨처스리그)
related:
- rule.extra_innings
- term.inning
- term.sacrifice_bunt
event_types: []
aliases:
- 타이브레이커
- 타이 브레이크
review_status: draft
reviewer: ''
more:
- 승부치기 이닝의 기록도 공식 기록에 포함돼요. 시작할 때 루에 놓인 주자는 실책으로 나간 것으로 보지만, 수비 팀에는 실책을 매기지 않아요.
